  - id: RISK-0009
    status: open
    title: "Flutter 3.47 semantics regression #191095; forui pinned >=0.26 as mitigation"
    category: dependency
    severity: medium
    owner: "TBD"
    opened: "2026-08-25"
    source: "reports/2026-08-13-flutter-dependency-ci-audit.md"
    description: >
      Flutter 3.47 ships an open regression (flutter/flutter#191095): focusing a
      text field inside a MergeSemantics subtree throws the isMergedIntoParent
      assertion in widget tests. forui <=0.25 triggers it (FTextField wraps
      itself in MergeSemantics). Mitigated by pinning forui ^0.26.0, which
      dropped the wrapper, plus a material-localizations scope workaround around
      the inventory-entry unit dropdown (forui 0.26 injects a shadowing
      Localizations fallback inside suffixBuilder). Upstream fix PR
      flutter/flutter#191587 not merged as of 2026-08-25.
    impact: >
      Until upstream fixes it, any new text-field-in-merged-subtree UI must use
      forui 0.26 patterns; plain Material TextField tests are unaffected unless
      placed under MergeSemantics.
    mitigation: "forui ^0.26.0 pin; documented finder migration (EditableText); localizations-scope wrapper."
    revisit_trigger: "When flutter/flutter#191587 merges and a fixed stable ships: retest, consider dropping workarounds."
    refs:
      - "https://github.com/flutter/flutter/issues/191095"
      - "reports/2026-08-13-flutter-dependency-ci-audit.md"
    closed:
      date:
      reason:
    # STEP-50.1 (2026-09-08): upstream PR flutter/flutter#191587 MERGED to flutter master
    # 2026-09-03, but no stable release containing it has shipped yet (local 3.47.1 is
    # 2026-08-19). Trigger half-fired; retest when the next stable lands. Follow-up: STEP-53.

  - id: RISK-0008
    status: monitoring
    title: "flutter_secure_storage upgraded from v9 directly to v11 (skipped v10 migration)"
    category: dependency
    severity: medium
    owner: "TBD"
    opened: "2026-08-13"
    source: "reports/2026-08-13-flutter-dependency-ci-audit.md"
    description: >
      flutter_secure_storage upgraded from ^9.2.4 directly to ^11.0.0 in STEP-43.
      v11 removed encryptedSharedPreferences from AndroidOptions (hardware Keystore
      is always used at minSdk 23+) and removed other deprecated encryption
      algorithms. Normally requires staged v9→v10→v11 upgrade because v10 runs a
      one-time key migration. This skip was accepted because the app is in
      development with no real device data. minSdk raised to 23 per v11 requirement. Session restore correctly verified against a live backend in STEP-48.3.
      If the app is ever deployed to real users on v9.x keys, a staged rollout
      must be performed before upgrading to v11 to avoid silent data loss.
    impact: "Silent unreadability of previously stored secure data if real users existed on v9. Dev-only: no impact."
    mitigation: >
      Dev/CI environment only as of STEP-43. minSdk = 23 explicit in build.gradle.kts.
      (Update STEP-47.1: flutter_secure_storage_windows upgraded 4.0.0 → 4.2.2 / win32 6.x.
      This explicitly alters only the Windows-desktop storage surface; the Android Keystore posture is unaffected).
    revisit_trigger: "Before any production release if there are existing users on v9 keys."
    refs:
      - "reports/2026-08-13-flutter-dependency-ci-audit.md"
      - "Upcoming Prompts/mine-flow-STEP-47.1-PROMPT.md"
    closed:
      date:
      reason:

