      Four related S0 checklist items could not be verified locally (require GitHub
      UI access) or are deferred for the internal MVP stage:
      (1) Branch protection / required-status-checks rules not confirmed in GitHub settings.
      (2) GitHub secret scanning / push protection not confirmed enabled.
      (3) GitHub Dependabot alerts not confirmed enabled.
      (4) No custom security monitoring beyond Supabase Auth logs.
      Also: third-party CI actions pinned by tag (not SHA digest); formal security
      ownership not assigned beyond Project Manager / Site Supervisor.
    impact: >
      Without branch protection a bad push to master bypasses CI. Without secret
      scanning a leaked key may not be caught automatically. Without Dependabot a
      vulnerable dependency could go unnoticed. Without monitoring, anomalous
      access patterns are invisible.
    mitigation: >
      Single-developer project at pre-production stage; risk is bounded.
      Check-in cadence and STEP-43 manual dependency review provide partial coverage.
      Supabase Auth logs visible in dashboard.
    revisit_trigger: "Before production release; before external contributors; at next S1 sweep."
    refs:
      - "reports/security/2026-08-26-step-0044-s0-security-baseline-report.md"
    closed:
      date:
      reason:

  - id: RISK-0014
    status: open
    title: "Reporting datasource still on legacy cut/fill volume columns and net = cut − fill"
    category: tech-debt
    severity: medium
    owner: "TBD"
    opened: "2026-08-27"
    source: "adr/ADR-0012-volume-and-land-clearing-metrics.md"
    description: >
      STEP-46.4 corrected the earthworks volume semantics per ADR-0012 (bank-equivalent
      net via VolumeNormalizer; BCM/LCM relabelled) in the entity, blocs, dashboard and
      summary cards. The reporting export path was not aligned: `reporting_remote_datasource.dart`
      still queries the legacy `cut_volume_m3`/`fill_volume_m3` columns and computes
      `net_volume_m3 = cut − fill`, the very formula ADR-0012 rejected as meaningless.
    impact: >
      Generated cut/fill PDF reports use the old, incorrect net-volume basis while the
      in-app dashboard/summary use the corrected one, so a report and the screen it was
      generated from can disagree on the headline volume.
    mitigation: >
      In-app surfaces (the primary MVP path) are corrected. Report generation is a
      secondary path; align it with the entity's `bcm_volume`/`lcm_volume` columns and
      the VolumeNormalizer net in a follow-up STEP before reports are relied upon.
    revisit_trigger: "Before cut/fill PDF reports are used operationally; next reporting STEP."
    refs:
      - "adr/ADR-0012-volume-and-land-clearing-metrics.md"
      - "prompts/003-release-readiness-integration-scale/step-0046/mine-flow-STEP-46.3-FINDINGS.md"
    closed:
      date:
      reason:

