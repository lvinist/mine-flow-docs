  - id: RISK-0012
    status: open
    title: "Supabase free-tier: no automatic daily backups; restore not fire-drilled"
    category: operations
    severity: high
    owner: "TBD"
    opened: "2026-08-26"
    source: "reports/security/2026-08-26-step-0044-s0-security-baseline-report.md"
    description: >
      The Supabase project is on the free tier, which does not include automatic
      daily backups or point-in-time recovery (PITR). A manual backup/restore
      procedure is documented in the S0 report (§Backup), but a live restore
      fire-drill has not been performed (no production data exists yet as of STEP-44).
    impact: >
      In the event of accidental data deletion or corruption before a manual
      backup is taken, data loss would be unrecoverable. Acceptable pre-production
      but must be addressed before real operational data is loaded.
    mitigation: >
      Manual snapshot procedure documented in S0 report. Must upgrade to a paid
      Supabase plan (Pro or higher) before production use to enable automatic
      daily backups and PITR, or establish a scheduled manual backup job.
    revisit_trigger: "Before first production data load; before production Supabase project is provisioned."
    refs:
      - "reports/security/2026-08-26-step-0044-s0-security-baseline-report.md"
    closed:
      date:
      reason:

