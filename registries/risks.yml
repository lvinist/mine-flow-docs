  - id: RISK-0014
    status: mitigated
    title: "Reporting datasource cut/fill mapping and net-volume semantics"
    category: tech-debt
    severity: medium
    owner: "STEP-48.27"
    opened: "2026-08-27"
    source: "adr/ADR-0012-volume-and-land-clearing-metrics.md"
    description: >-
      STEP-46.4 corrected earthworks semantics per ADR-0012 in the entity, blocs,
      dashboard, and summary cards. STEP-48.27 corrected the reporting export path:
      `reporting_remote_datasource.dart` now reads `bcm_volume`/`lcm_volume` and emits
      report-facing `cut_volume_m3`/`fill_volume_m3`/`net_volume_m3` keys at an explicit
      presentation-map boundary; `net_volume_m3` uses `VolumeNormalizer.bankEquivalent`
      rather than `cut - fill`. The source-path correction is committed in the STEP-48
      branch and confirmed by branch-head run 34225431645; a dedicated PDF regeneration
      check has not yet been recorded. STEP-48.18's runtime evidence observed the old query
      falling back to 0.0 for missing volumes, leading to silent zero-volume reports; that
      release-blocking evidence is retained here as history.
    impact: >-
      Before STEP-48.27, generated cut/fill PDF reports could disagree with the corrected
      in-app dashboard. The source-path defect is addressed and the branch-head journey is
      green, but release evidence still needs a dedicated PDF regeneration check.
    mitigation: >-
      Keep the 48.27 change through the app commit/push lane; before operational PDF use,
      regenerate a report and verify its headline against the bank-equivalent mapping.
    revisit_trigger: "Before operational PDF use, regenerate a report and verify its headline against the bank-equivalent mapping."
    refs:
      - "adr/ADR-0012-volume-and-land-clearing-metrics.md"
      - "reports/2026-09-05-step-45-47-implementation-audit.md"
      - "prompts/003-release-readiness-integration-scale/step-0048/mine-flow-STEP-48.27-FINDINGS.md"
    closed:
      date:
      reason:

