      in-app dashboard/summary use the corrected one, so a report and the screen it was
      generated from can disagree on the headline volume.
    mitigation: >
      In-app surfaces (the primary MVP path) are corrected. Report generation is a
      secondary path; align it with the entity's `bcm_volume`/`lcm_volume` columns and
      the VolumeNormalizer net in a follow-up STEP before reports are relied upon.
    revisit_trigger: "Before cut/fill PDF reports are used operationally; next reporting STEP."
    refs:
      - "adr/ADR-0012-volume-and-land-clearing-metrics.md"
      - "prompts/003-release-readiness-integration-scale/step-0046/mine-flow-STEP-46.3-FINDINGS.md"
    closed:
      date:
      reason:

