  - id: RISK-0012
    status: open
    title: "Supabase free-tier: no automatic daily backups; restore not fire-drilled"
    category: operations
    severity: high
    owner: "TBD"
    opened: "2026-08-26"
    source: "reports/security/2026-08-26-step-0044-s0-security-baseline-report.md"
    description: >
      The Supabase project is on the free tier, which does not include automatic
      daily backups or point-in-time recovery (PITR). A manual backup/restore
      procedure is documented in the S0 report (§Backup), but a live restore
      fire-drill has not been performed (no production data exists yet as of STEP-44).
    impact: >
      In the event of accidental data deletion or corruption before a manual
      backup is taken, data loss would be unrecoverable. Acceptable pre-production
      but must be addressed before real operational data is loaded.
    mitigation: >
      Manual snapshot procedure documented in S0 report. Must upgrade to a paid
      Supabase plan (Pro or higher) before production use to enable automatic
      daily backups and PITR, or establish a scheduled manual backup job.
    revisit_trigger: "Before first production data load; before production Supabase project is provisioned."
    refs:
      - "reports/security/2026-08-26-step-0044-s0-security-baseline-report.md"
    closed:
      date:
      reason:

  - id: RISK-0013
    status: open
    title: "S0 baseline operations cluster: branch protection, secret scanning, Dependabot, monitoring"
    category: operations
    severity: medium
    owner: "TBD"
    opened: "2026-08-26"
    source: "reports/security/2026-08-26-step-0044-s0-security-baseline-report.md"
    description: >
      Four related S0 checklist items could not be verified locally (require GitHub
      UI access) or are deferred for the internal MVP stage:
      (1) Branch protection / required-status-checks rules not confirmed in GitHub settings.
      (2) GitHub secret scanning / push protection not confirmed enabled.
      (3) GitHub Dependabot alerts not confirmed enabled.
      (4) No custom security monitoring beyond Supabase Auth logs.
      Also: third-party CI actions pinned by tag (not SHA digest); formal security
      ownership not assigned beyond Project Manager / Site Supervisor.
    impact: >
      Without branch protection a bad push to master bypasses CI. Without secret
      scanning a leaked key may not be caught automatically. Without Dependabot a
      vulnerable dependency could go unnoticed. Without monitoring, anomalous
      access patterns are invisible.
    mitigation: >
      Single-developer project at pre-production stage; risk is bounded.
      Check-in cadence and STEP-43 manual dependency review provide partial coverage.
      Supabase Auth logs visible in dashboard.
    revisit_trigger: "Before production release; before external contributors; at next S1 sweep."
    refs:
      - "reports/security/2026-08-26-step-0044-s0-security-baseline-report.md"
    closed:
      date:
      reason:

  - id: RISK-0014
    status: mitigated
    title: "Reporting datasource cut/fill mapping and net-volume semantics"
    category: tech-debt
    severity: medium
    owner: "STEP-48.27"
    opened: "2026-08-27"
    source: "adr/ADR-0012-volume-and-land-clearing-metrics.md"
    description: >-
      STEP-46.4 corrected earthworks semantics per ADR-0012 in the entity, blocs,
      dashboard, and summary cards. STEP-48.27 corrected the reporting export path:
      `reporting_remote_datasource.dart` now reads `bcm_volume`/`lcm_volume` and emits
      report-facing `cut_volume_m3`/`fill_volume_m3`/`net_volume_m3` keys at an explicit
      presentation-map boundary; `net_volume_m3` uses `VolumeNormalizer.bankEquivalent`
      rather than `cut - fill`. The source-path correction is committed in the STEP-48
      branch and confirmed by branch-head run 34225431645; a dedicated PDF regeneration
      check has not yet been recorded. STEP-48.18's runtime evidence observed the old query
      falling back to 0.0 for missing volumes, leading to silent zero-volume reports; that
      release-blocking evidence is retained here as history.
    impact: >-
      Before STEP-48.27, generated cut/fill PDF reports could disagree with the corrected
      in-app dashboard. The source-path defect is addressed and the branch-head journey is
      green, but release evidence still needs a dedicated PDF regeneration check.
    mitigation: >-
      Keep the 48.27 change through the app commit/push lane; before operational PDF use,
      regenerate a report and verify its headline against the bank-equivalent mapping.
    revisit_trigger: "Before operational PDF use, regenerate a report and verify its headline against the bank-equivalent mapping."
    refs:
      - "adr/ADR-0012-volume-and-land-clearing-metrics.md"
      - "reports/2026-09-05-step-45-47-implementation-audit.md"
      - "prompts/003-release-readiness-integration-scale/step-0048/mine-flow-STEP-48.27-FINDINGS.md"
    closed:
      date:
      reason:

